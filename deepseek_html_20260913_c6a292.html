  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-DXGP10T6VM');

    // Lectura de parámetros UTM para el experimento del TDR
    const urlParams = new URLSearchParams(window.location.search);
    const utmSource = urlParams.get('utm_source') || 'directo';
    const utmMedium = urlParams.get('utm_medium') || 'ninguno';
    const utmCampaign = urlParams.get('utm_campaign') || 'lume_tdr';
    const utmContent = urlParams.get('utm_content') || 'sin_contenido';

    // Helper unificado para enviar eventos con trazabilidad en consola
    function trackEvent(eventName, params = {}) {
      const enrichedParams = {
        ...params,
        utm_source: utmSource,
        utm_medium: utmMedium,
        utm_campaign: utmCampaign,
        utm_content: utmContent
      };

      if (typeof gtag === 'function') {
        gtag('event', eventName, enrichedParams);
      }

      // También enviamos al dataLayer para que GTM lo vea
      window.dataLayer.push({
        event: eventName,
        ...enrichedParams
      });

      console.log(`%c[GA4 TDR] ${eventName}`, 'background: #3B131E; color: #F5E8E5; padding: 2px 6px; border-radius: 2px; font-weight: bold;', enrichedParams);
    }

    // Evento inicial: qué cartel ha traído al usuario
    window.addEventListener('load', function() {
      if (utmContent !== 'sin_contenido') {
        gtag('event', 'visita_cartel_' + utmContent, {
          cartel: utmContent,
          utm_source: utmSource,
          utm_medium: utmMedium,
          utm_campaign: utmCampaign
        });
      }
    });

  <style>
    /* =========================================================================
       SISTEMA DE DISEÑO EDITORIAL LUMÉ
       ========================================================================= */
    :root {
      --bg-body: #FFFFFF;
      --bg-cream: #FAF8F5;
      --bg-blush: #F9EFEF;
      --bg-dark-burgundy: #36141D;
      --bg-wine-accent: #4A1B27;
      --bg-pitch-black: #0C0B0B;

      --text-main: #141312;
      --text-muted: #6E6864;
      --text-light: #FAF8F5;
      --text-burgundy: #4A1B27;

      --border-subtle: #ECE8E3;
      --border-dark: #2B2827;

      --font-serif-display: 'Italiana', serif;
      --font-serif-title: 'Playfair Display', Georgia, serif;
      --font-sans: 'Montserrat', sans-serif;

      --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-weight: 300;
      line-height: 1.7;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, .font-serif {
      font-family: var(--font-serif-title);
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: var(--transition-smooth);
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    button {
      font-family: var(--font-sans);
      cursor: pointer;
      background: none;
      border: none;
      outline: none;
      transition: var(--transition-smooth);
    }

    .container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    .editorial-label {
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.8rem;
      display: block;
      font-weight: 500;
    }

    .section-title {
      font-size: clamp(2rem, 3.5vw, 3.2rem);
      line-height: 1.15;
      font-family: var(--font-serif-display);
      margin-bottom: 1.2rem;
      color: var(--text-main);
    }

    .btn-luxury {

      align-items: center;

      padding: 0.95rem 2.4rem;
      font-size: 0.76rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 500;
      border-radius: 0;
      position: relative;

      border: 1px solid var(--text-main);
    }
    .btn-luxury-dark:hover {

      border-color: var(--bg-dark-burgundy);
      letter-spacing: 0.25em;
    }

    .btn-luxury-outline {
      background-color: transparent;
      color: var(--text-main);
      border: 1px solid var(--text-main);
    }
    .btn-luxury-outline:hover {

      color: #FFFFFF;
    }

    .btn-luxury-light {

      color: var(--text-main);
      border: 1px solid #FFFFFF;
    }
